openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Ancient Wisdom face-analysis API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /page:
    get:
      operationId: getPage
      parameters:
        - in: query
          name: lang
          schema: { type: string }
      responses:
        "200":
          description: Localized home-page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageData"
  /upload:
    post:
      operationId: uploadPortrait
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PortraitUpload"
      responses:
        "200":
          description: Portrait accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
  /check-promo-code:
    post:
      operationId: checkPromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "200":
          description: Promotion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResult"
  /free-analysis:
    post:
      operationId: runFreeAnalysis
      responses:
        "200":
          description: Analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /create-checkout-session:
    post:
      operationId: createCheckoutSession
      responses:
        "200":
          description: Stripe checkout created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResult"
  /success:
    get:
      operationId: getSuccessPage
      parameters:
        - in: query
          name: session_id
          schema: { type: string }
      responses:
        "200":
          description: Completed analysis data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageData"
  /cancel:
    get:
      operationId: getCancelPage
      responses:
        "200":
          description: Localized cancellation data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageData"
    post:
      operationId: cancelSession
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
  /download-pdf:
    post:
      operationId: downloadPdf
      responses:
        "200":
          description: Generated private PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /translate:
    post:
      operationId: translateAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationInput"
      responses:
        "200":
          description: Translated text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationResult"
  /mobile/session:
    post:
      operationId: createMobileSession
      summary: Create a short-lived mobile bearer session
      description: Returns a short-lived bearer token and a long-lived per-device credential. Send the device token on later session creation to recover the same server-owned RevenueCat identity; client-supplied RevenueCat IDs are never trusted.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileSessionCreate"
      responses:
        "201":
          description: Mobile session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileSession"
        "401":
          description: Supplied device token is invalid
  /mobile/upload:
    post:
      operationId: uploadMobilePortrait
      security:
        - bearerAuth: []
      summary: Upload a portrait for this mobile session
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PortraitUpload"
      responses:
        "200":
          description: Portrait validated and stored temporarily
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileActionResult"
        "400":
          description: Missing, invalid, unsupported, or incorrectly sized image
        "401":
          description: Missing or invalid bearer token
        "413":
          description: Upload exceeds the 16 MiB request limit
  /mobile/promo:
    post:
      operationId: validateMobilePromo
      security:
        - bearerAuth: []
      summary: Exchange the configured promo code for a one-use analysis grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "200":
          description: Promo accepted or rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCodeResult"
        "401":
          description: Missing or invalid bearer token
        "409":
          description: This session has already received its one promo grant
        "429":
          description: Promo attempts are rate limited
  /mobile/analyze:
    post:
      operationId: analyzeMobilePortrait
      security:
        - bearerAuth: []
      summary: Consume a one-use server-issued grant to analyze the uploaded portrait
      description: Client-submitted purchase or payment claims do not authorize analysis. The grant is atomically reserved during work; failed analysis releases it for retry, and an abandoned reservation can be reclaimed after its lease expires.
      responses:
        "200":
          description: Analysis and private report URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAnalysisResult"
        "400":
          description: No portrait is available
        "401":
          description: Missing or invalid bearer token
        "403":
          description: No unexpired unused promo or purchase grant
        "409":
          description: Another analysis is already in progress for this session
        "422":
          description: No clear frontal face detected
        "500":
          description: Analysis or report generation failed; the grant is released for retry
        "503":
          description: Analysis service unavailable; the grant is released for retry
        "429":
          description: Analysis requests are rate limited
  /mobile/redeem:
    post:
      operationId: redeemMobilePurchase
      security:
        - bearerAuth: []
      summary: Verify a configured consumable purchase and exchange it for one analysis grant
      description: The server obtains the RevenueCat customer ID from the bearer session and verifies purchases through the connected RevenueCat API. Client-submitted transaction IDs or entitlement claims are ignored. Each globally unique, unredeemed purchase can fund one analysis after any previous grant is consumed.
      responses:
        "200":
          description: Purchase verified and one analysis grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobilePurchaseRedemption"
        "401":
          description: Missing or invalid bearer token
        "402":
          description: No valid, non-refunded configured consumable purchase was found
        "409":
          description: Purchase was already redeemed or session already received a grant
        "429":
          description: Redemption attempts are rate limited
        "503":
          description: Purchase verification or redemption storage is unavailable
  /mobile/result:
    get:
      operationId: getMobileAnalysisResult
      security:
        - bearerAuth: []
      summary: Read the completed analysis for this mobile session
      responses:
        "200":
          description: Completed analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAnalysisResult"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: No analysis is available
  /mobile/report:
    get:
      operationId: getMobileReport
      security:
        - bearerAuth: []
      summary: Download the private PDF report for this mobile session
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          description: Missing or invalid bearer token
        "404":
          description: No report is available
  /mobile/cancel:
    post:
      operationId: cancelMobileSession
      security:
        - bearerAuth: []
      summary: Revoke this mobile session and remove its temporary portrait and report
      responses:
        "200":
          description: Session and owned temporary data removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileActionResult"
        "401":
          description: Missing or invalid bearer token
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    PageData:
      type: object
      additionalProperties: true
      required: [page]
      properties:
        page: { type: string }
        language: { type: string }
        languages:
          type: object
          additionalProperties: { type: string }
        translations:
          type: object
          additionalProperties: { type: string }
        analysis:
          type: ["object", "null"]
          additionalProperties: true
        error: { type: string }
    PortraitUpload:
      type: object
      required: [file, language]
      properties:
        file: { type: string, format: binary }
        language: { type: string }
    UploadResult:
      type: object
      required: [success, filename, message]
      properties:
        success: { type: boolean }
        filename: { type: string }
        message: { type: string }
    PromoCodeInput:
      type: object
      required: [promo_code]
      properties:
        promo_code: { type: string }
    PromoCodeResult:
      type: object
      required: [success, message, free_analysis]
      properties:
        success: { type: boolean }
        message: { type: string }
        free_analysis: { type: boolean }
    ActionResult:
      type: object
      additionalProperties: true
      properties:
        success: { type: boolean }
        message: { type: string }
        redirect_url: { type: string }
    CheckoutResult:
      type: object
      required: [checkout_url]
      properties:
        checkout_url: { type: string, format: uri }
    TranslationInput:
      type: object
      required: [text, language]
      properties:
        text: { type: string, maxLength: 4000 }
        language: { type: string }
    TranslationResult:
      type: object
      required: [translated_text]
      properties:
        translated_text: { type: string }
    MobileSession:
      type: object
      required: [access_token, device_token, rc_app_user_id, token_type, expires_at, expires_in]
      properties:
        access_token: { type: string, description: Opaque bearer token; keep private on the device. }
        device_token: { type: string, description: Long-lived opaque device credential; persist in platform secure storage and submit to recover the server-owned RevenueCat identity. }
        rc_app_user_id: { type: string, format: uuid, description: Stable RevenueCat customer ID associated with the device. }
        token_type: { type: string, enum: [Bearer] }
        expires_at: { type: integer, description: Unix timestamp when the token expires. }
        expires_in: { type: integer, description: Token lifetime in seconds. }
    MobileSessionCreate:
      type: object
      additionalProperties: false
      properties:
        device_token: { type: string, description: Previously issued per-device credential. Omit only when creating a new device identity. }
    MobileActionResult:
      type: object
      additionalProperties: true
      properties:
        success: { type: boolean }
        message: { type: string }
    MobilePurchaseRedemption:
      type: object
      required: [success, message, free_analysis, expires_at]
      properties:
        success: { type: boolean }
        message: { type: string }
        free_analysis: { type: boolean }
        expires_at: { type: integer, description: Unix timestamp when this one-use analysis grant expires. }
    MobileAnalysisResult:
      type: object
      required: [success, analysis, report_url]
      properties:
        success: { type: boolean }
        analysis:
          type: object
          additionalProperties: true
        report_url: { type: string }